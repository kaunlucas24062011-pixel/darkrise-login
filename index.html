<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Rise - Login</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { background:#111; color:#fff; font-family:sans-serif; text-align:center; padding-top:40px; margin:0; }
  #status { margin-top:24px; font-size:18px; color:#aaa; }
  #botao { margin-top:24px; display:flex; justify-content:center; }
</style>
</head>
<body>
<h2>Dark Rise</h2>
<p id="status">Escolha sua conta Google...</p>
<div id="botao"></div>

<script>
const CLIENT_ID = "165155069052-bpcsu741lhhv1k27kd9dnvh2s4fd72co.apps.googleusercontent.com";
const SERVIDOR = "https://darkrise-servidor-xix2.onrender.com";
const PACOTE_APP = "Darkrise.com";
// codigo da sessao que o jogo manda na URL: ?s=CODIGO
const sessao = new URLSearchParams(location.search).get("s") || "";
const status = document.getElementById("status");

function mostrar(msg) { status.textContent = msg; }

// Abre o jogo pelo pacote do app (funciona no Chrome do Android sem precisar de intent filter)
function voltarAoJogo() {
  location.href = "intent://#Intent;package=" + PACOTE_APP +
    ";action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
}

// Chamado pelo Google quando a conta foi escolhida
async function aoReceberCredencial(resposta) {
  if (!sessao) { mostrar("Abra o login pelo jogo."); return; }
  mostrar("Confirmando login...");
  try {
    const r = await fetch(SERVIDOR + "/login-google", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessao: sessao, token: resposta.credential })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { mostrar("Erro: " + (d.erro || r.status) + ". Tente de novo."); return; }
    mostrar("Login feito! Voltando ao jogo...");
    voltarAoJogo();
  } catch (erro) {
    mostrar("Sem conexão com o servidor. Aguarde uns segundos e tente de novo.");
  }
}

function iniciarGoogle() {
  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: aoReceberCredencial,
    auto_select: true,            // se só existe uma conta usada antes, entra sem tocar
    cancel_on_tap_outside: false
  });
  // botao de reserva: aparece se o seletor automatico nao abrir
  google.accounts.id.renderButton(document.getElementById("botao"),
    { type: "standard", size: "large", text: "continue_with" });
  // abre o seletor de conta sozinho
  google.accounts.id.prompt();
}

window.addEventListener("load", () => {
  if (window.google && google.accounts) iniciarGoogle();
  else mostrar("Não carregou o login do Google. Recarregue a página.");
});
</script>
</body>
</html>
